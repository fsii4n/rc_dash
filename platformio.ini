; RaceChrono BLE monitor display for Waveshare ESP32-C6-Touch-AMOLED-2.06
;
; Uses the pioarduino fork of platform-espressif32 (Arduino core 3.x / IDF 5.x).
; The official platformio/espressif32 platform is frozen at Arduino core 2.x
; and no longer maintained by Espressif.

[env:amoled-c6-206]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; ESP32-C6: single RISC-V core, 512KB HP SRAM (no PSRAM), 16MB QSPI flash
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200

build_flags =
    ; USB Serial/JTAG console (Serial = HWCDC; USB_MODE=1 selects the
    ; hardware JTAG-CDC — the C6 has no USB-OTG)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; lv_conf.h lives in include/
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=2
    ; select AXP2101 support in XPowersLib
    -DXPOWERS_CHIP_AXP2101
    ; 16KB QSPI transactions (default 1024 px = 2KB): fewer per-flush
    ; transaction setups; bus allocates 2x16KB DMA bounce buffers
    -DESP32QSPI_MAX_PIXELS_AT_ONCE=8192

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    lvgl/lvgl@8.4.0
    h2zero/NimBLE-Arduino@^2.3.0
    lewisxhe/XPowersLib@^0.3.0
