; RaceChrono BLE monitor display for Waveshare ESP32-S3-Touch-AMOLED-1.75C
;
; Uses the pioarduino fork of platform-espressif32 (Arduino core 3.x / IDF 5.x).
; The official platformio/espressif32 platform is frozen at Arduino core 2.x
; and no longer maintained by Espressif.

[env:amoled-175c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8: 8MB octal PSRAM, 32MB QSPI flash
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    ; USB-C CDC console
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; lv_conf.h lives in include/
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=2
    ; select AXP2101 support in XPowersLib
    -DXPOWERS_CHIP_AXP2101
    ; 16KB QSPI transactions (default 1024 px = 2KB): fewer per-flush
    ; transaction setups; bus allocates 2x16KB DMA bounce buffers
    -DESP32QSPI_MAX_PIXELS_AT_ONCE=8192

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    lvgl/lvgl@8.4.0
    h2zero/NimBLE-Arduino@^2.3.0
    lewisxhe/XPowersLib@^0.3.0
